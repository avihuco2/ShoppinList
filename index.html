<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>רשימת קניות</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;margin:0;background:#fff;color:#111}
header{position:sticky;top:0;background:#1a3d7c;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:34px;margin:0}
#left{font-size:26px}
h2{font-size:28px;margin:24px 20px 6px;color:#1a3d7c;border-bottom:3px solid #1a3d7c;padding-bottom:4px}
button.item{display:block;width:calc(100% - 24px);margin:8px 12px;padding:18px 20px;font-size:36px;font-weight:600;text-align:right;background:#f2f4f8;border:2px solid #c9d1e0;border-radius:14px;color:#111}
button.item:active{background:#dfe6f3}
#undo{position:fixed;bottom:20px;left:20px;right:20px;font-size:30px;padding:18px;border-radius:14px;border:0;background:#333;color:#fff;display:none}
#done{font-size:36px;text-align:center;margin:60px 20px;display:none}
#reset{font-size:22px;margin:30px 20px 100px;padding:12px 18px;border-radius:10px;border:1px solid #999;background:#fff}
</style></head><body>
<header><h1>🛒 קניות</h1><span id="left"></span></header>
<main id="list"></main>
<div id="done">✅ קנית הכל!</div>
<button id="reset">החזר את כל הפריטים</button>
<button id="undo">↩ ביטול מחיקה</button>
<script>
const LIST_ID="2026-10-23";
const CATS={"פסטה ודגנים": ["פסטה", "לזניה", "ניוקי"], "שימורים ורטבים": ["Mutti", "רסק עגבניות", "עגבניות מרוסקות", "טונה", "חומוס בקופסא", "זיתים", "קטשופ", "מיונז"], "ירקות ופירות": ["תפוחי אדמה", "ירקות", "פירות"], "מקרר": ["טופו", "גבינות", "מעדנים"], "קפואים": ["שניצל טבעול", "אפונה קפואה", "שעועית קפואה", "גלידה"], "חטיפים": ["בייגלה", "קרקרים", "צ'יפס"], "ניקיון": ["טבליות למדיח"]};
const KEY="shop-"+LIST_ID;
let bought=JSON.parse(localStorage.getItem(KEY)||"[]");let last=[];let t;
function save(){localStorage.setItem(KEY,JSON.stringify(bought))}
function render(){const m=document.getElementById("list");m.innerHTML="";let n=0;
for(const [c,items] of Object.entries(CATS)){const left=items.filter(i=>!bought.includes(i));if(!left.length)continue;
const h=document.createElement("h2");h.textContent=c;m.appendChild(h);
for(const i of left){n++;const b=document.createElement("button");b.className="item";b.textContent=i;
b.onclick=()=>{bought.push(i);last.push(i);save();render();showUndo()};m.appendChild(b)}}
document.getElementById("left").textContent=n?("נשארו "+n):"";
document.getElementById("done").style.display=n?"none":"block"}
function showUndo(){const u=document.getElementById("undo");u.style.display="block";clearTimeout(t);t=setTimeout(()=>{u.style.display="none";last=[]},6000)}
document.getElementById("undo").onclick=()=>{const i=last.pop();if(i){bought=bought.filter(x=>x!==i);save();render()}if(!last.length)document.getElementById("undo").style.display="none"};
document.getElementById("reset").onclick=()=>{if(confirm("להחזיר את כל הפריטים?")){bought=[];save();render()}};
render();
</script></body></html>
